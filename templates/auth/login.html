{% extends 'base.html' %}

{% block title %}Login — ResultIQ{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your ResultIQ account</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="login_id" class="form-label">Email or Username</label>
        <input type="text" id="login_id" name="login_id" class="form-input"
               required autofocus autocomplete="username" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input"
               required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem;">
        Sign In →
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
