{% extends 'base.html' %}

{% block title %}Register — ResultIQ{% endblock %}

{% block content %}
<div class="auth-container" style="max-width:520px;">
  <div class="auth-card">
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Join ResultIQ to analyse student results</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" id="name" name="name" class="form-input"
               required autofocus autocomplete="name" placeholder="Dr. Jane Smith">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-input"
                 required autocomplete="email" placeholder="jane@college.edu">
        </div>
        <div class="form-group">
          <label for="username" class="form-label">Username *</label>
          <input type="text" id="username" name="username" class="form-input"
                 required autocomplete="username" placeholder="jsmith">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="department" class="form-label">Department</label>
          <input type="text" id="department" name="department" class="form-input"
                 placeholder="Computer Science">
        </div>
        <div class="form-group">
          <label for="designation" class="form-label">Designation</label>
          <input type="text" id="designation" name="designation" class="form-input"
                 placeholder="Professor">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input type="password" id="password" name="password" class="form-input"
                 required autocomplete="new-password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                 required autocomplete="new-password" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary"
              style="width:100%;justify-content:center;margin-top:.5rem;">
        Create Account →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
